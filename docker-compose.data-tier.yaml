version: '3.8'

networks:
  infra_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  portainer_data:
  uptime_kuma_data:

services:
  
  # Database Utama (PostgreSQL 16)
  
  db-agilix:
    image: postgres:16-alpine
    container_name: db-agilix
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=3GB
      -c effective_cache_size=8GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infra_net

  
  # Connection Pooler (PgBouncer)
  
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db-agilix
      DB_PORT: 5432
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      - db-agilix
    networks:
      - infra_net

  
  # In-Memory Cache & Queue (Redis)
  
  agilix-redis:
    image: redis:7-alpine
    container_name: agilix-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - infra_net

  
  # S3 Object Storage (MinIO)
  
  agilix-minio:
    image: minio/minio:latest
    container_name: agilix-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - infra_net

  
  # Otomatisasi Backup Harian (Direct to MinIO)
  
  postgres-backup:
    image: schickling/postgres-backup-s3:latest
    container_name: postgres_backup
    restart: always
    environment:
      SCHEDULE: '@daily'
      POSTGRES_HOST: db-agilix
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://agilix-minio:9000
      S3_BUCKET: db-backups
      S3_PREFIX: postgres/
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      - db-agilix
      - agilix-minio
    networks:
      - infra_net

  
  # Docker GUI Management (Portainer)
  
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:9002:9000"
    networks:
      - infra_net

  
  # Monitoring & Uptime Alert (Uptime Kuma)
  
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime_kuma
    restart: always
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - infra_net


