# =============================================================================
# 1. API INVOICE BACKEND (Docker Swarm Service: app:3000)
# =============================================================================
upstream app_backend {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-invoice.agilix.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-invoice.agilix.id;

    ssl_certificate /etc/letsencrypt/live/api-invoice.agilix.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-invoice.agilix.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 15M;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Realtime Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Endpoint SSE (Server-Sent Events)
    location ~* /(events|sse|notifications) {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering & cache for realtime streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-transform";

        # Prevent timeout on long-lived SSE connections
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /uploads/ {
        proxy_pass http://app_backend/uploads/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

