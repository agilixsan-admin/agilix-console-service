services:
  postgres-test:
    image: postgres:16-alpine
    container_name: agilix-postgres-test
    environment:
      POSTGRES_USER: agilix_test
      POSTGRES_PASSWORD: agilix_test_password
      POSTGRES_DB: agilix_console_test
    ports:
      - '5435:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agilix_test -d agilix_console_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: agilix-redis-test
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
